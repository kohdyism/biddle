<!DOCTYPE html>

<head>
    <title>Password Recovery</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <nav class="topnav">
        <img src="resources/logo.jpg" height="40">
        <ul class="topnavL">
            <!--             
            <li><a href="">Home</a></li>
            <li><a href="">News</a></li>
            <li><a href="">Contact</a></li>
            <li><a href="">About</a></li> -->

        </ul>
    </nav>

    <div class="signInFormDiv">
        <form class="signInForm">
            <h2>Forgot Password</h2>
            <div class="FormFieldSet">
                <label class="formFieldLabel" for="email">Email</label><br>
                <input class="formField" type="text" id="email" name="email" placeholder="Type your email here"><br>
                <span class="error-msg" id="email-error"></span>
                <span class="success-msg" id="email-success"></span>
            </div>

            <div class="FormFieldSet">
                <label class="formFieldLabel" for="cemail">Confirm Email</label><br>
                <input class="formField" type="text" id="cemail" name="cemail"
                    placeholder="Confirm your email here"><br>
                <span class="error-msg" id="cemail-error"></span>
            </div>


            <button class="button" id="btn">
                Reset Password
            </button>

            <p class="textbottom"><a href="index.htm" class="link">Return to homepage</a></p>

            </p>
        </form>
    </div>
    <script src="passwordRecovery.js"></script>
</body>

</html>
